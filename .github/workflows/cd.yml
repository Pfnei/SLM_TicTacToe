# Name des Workflows
name: Java CD builds jar
# Triggers - Wann wird der Worklfow ausgeführt
on:
  push:
    branches:
      - 'main'

jobs:
  build:
    # Virtuelle Maschine, auf der der Job läuft
    runs-on: ubuntu-latest

    steps:
      # Checkt den aktuellen Repository-Code aus
      - uses: actions/checkout@v4
      # Installiert Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'


      # Baut das Projekt mit Maven
      # clean   -> löscht alte Build-Artefakte
      # package -> erzeugt die JAR-Datei
      # -DskipTests -> überspringt Tests (schneller Build)
      - name: Build JAR
        run: mvn clean package -DskipTests

      # Jar_file aus GitHub Actions Artefact hochladen
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: |
            target/*.jar
            !target/original-*.jar