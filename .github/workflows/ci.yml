name: Java CI with Maven
on:
  push:
    branches:
      - 'feature-*/**'
      - 'bugfix*/**'
      - 'task*/**'
      - 'refact*/**'
      - 'docu*/**'
  pull_request:
    branches:
      - 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run tests with Maven
        run: mvn test